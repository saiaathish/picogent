<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Picogent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">Picogent</div>
    <div class="status">
      <span id="badge" class="badge off">connecting</span>
      <span id="model" class="meta"></span>
    </div>
    <div class="actions">
      <button type="button" id="toggle-mode" class="ghost">Safe</button>
      <button type="button" id="reset" class="ghost">New chat</button>
      <a class="ghost linkbtn" href="/setup.html">Setup</a>
    </div>
  </header>
  <p id="workspace" class="workspace"></p>
  <p id="hint" class="hint" hidden></p>
  <main>
    <ol id="log"></ol>
  </main>
  <div id="perm" hidden>
    <p id="perm-text">Allow this?</p>
    <div class="perm-btns">
      <button type="button" class="yes" data-allow="1">Yes</button>
      <button type="button" class="no" data-allow="0">No</button>
      <button type="button" class="turn" data-turn="1">Yes this turn</button>
    </div>
  </div>
  <form id="composer">
    <textarea id="prompt" rows="3" placeholder="What should Picogent do?"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
