name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Test
        run: go test ./...
      - name: Web contract tests
        shell: bash
        run: node --test internal/gui/web/contracts.test.js
      - name: v0.2 release acceptance
        run: go test ./internal/acceptance -run TestV02ReleaseLoop -count=1
      - name: Vet
        run: go vet ./...
      - name: Race test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./internal/agent ./internal/gui ./internal/tui ./internal/taskstate ./internal/acceptance
      - name: Fuzz security boundaries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./internal/perm -run '^$' -fuzz '^FuzzResolveWorkspacePathBoundary$' -fuzztime=2s
          go test ./internal/tools -run '^$' -fuzz '^FuzzWebFetchIPBoundary$' -fuzztime=2s
      - name: Build
        run: go build -o picogent ./cmd/picogent
      - name: GUI listens
        shell: bash
        env:
          PICOGENT_GUI_ADDR: 127.0.0.1:7420
          PICOGENT_NO_BROWSER: "1"
          HOME: ${{ runner.temp }}/picogent-home
          USERPROFILE: ${{ runner.temp }}/picogent-home
        run: |
          mkdir -p "$HOME"
          BIN=./picogent
          if [[ -f ./picogent.exe ]]; then BIN=./picogent.exe; fi
          "$BIN" gui &
          pid=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:7420/api/state" >/tmp/pico-state.json; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [[ "$ok" != "1" ]]; then
            echo "GUI never answered /api/state"
            exit 1
          fi
          python - <<'PY' || python3 - <<'PY'
          import json
          d=json.load(open("/tmp/pico-state.json"))
          assert "mode" in d and "workspace" in d, d
          print("gui smoke ok", d.get("mode"), d.get("workspace"))
          PY

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -show verbose ./...

  release-evidence:
    needs: [test, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request.sha is GitHub's synthetic merge ref; use the source
          # commit so the evidence describes the reviewed tree exactly.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Write release gate ledger
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os

          def record(job, result, os_name, command):
              return {
                  "candidate_sha": os.environ["EXPECTED_SHA"],
                  "event": os.environ["EVENT_NAME"],
                  "job": job,
                  "os": os_name,
                  "command": command,
                  "status": "PASS" if result == "success" else "FAIL",
                  "exit_code": 0 if result == "success" else 1,
                  "truncated": False,
              }

          ledger = {
              "schema": "picogent.release-gates.v1",
              "candidate_sha": os.environ["EXPECTED_SHA"],
              "event": os.environ["EVENT_NAME"],
              "gates": [
                  record("test", os.environ["TEST_RESULT"], "matrix", "go test ./..."),
                  record("security", os.environ["SECURITY_RESULT"], "ubuntu-latest", "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -show verbose ./..."),
              ],
          }
          with open("artifacts/release-gates.json", "w", encoding="utf-8") as handle:
              json.dump(ledger, handle, indent=2)
              handle.write("\n")
          PY
      - name: Validate release gate ledger
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          go run ./cmd/release-gates \
            --ledger artifacts/release-gates.json \
            --expected-sha "$EXPECTED_SHA" \
            --event "$EVENT_NAME" \
            --required test,security
      - name: Generate verification manifest
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          go run ./cmd/verify-manifest \
            --workspace . \
            --expected-sha "$EXPECTED_SHA" \
            > artifacts/verification-manifest.json
      - name: Prepare release attestation predicate
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          def digest(path):
              hasher = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      hasher.update(chunk)
              return hasher.hexdigest()

          issued = datetime.datetime.now(datetime.timezone.utc)
          predicate = {
              "schema": "picogent.release-attestation.v1",
              "repository": os.environ["REPOSITORY"],
              "candidate_sha": os.environ["EXPECTED_SHA"],
              "event": os.environ["EVENT_NAME"],
              "workflow": os.environ["WORKFLOW_REF"],
              "run_id": int(os.environ["RUN_ID"]),
              "release_gates_sha256": digest("artifacts/release-gates.json"),
              "verification_manifest_sha256": digest("artifacts/verification-manifest.json"),
              "signer": os.environ["WORKFLOW_REF"],
              "issued_at": issued.isoformat().replace("+00:00", "Z"),
              "expires_at": (issued + datetime.timedelta(days=7)).isoformat().replace("+00:00", "Z"),
          }
          with open("artifacts/release-attestation-predicate.json", "w", encoding="utf-8") as handle:
              json.dump(predicate, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          sha256sum artifacts/release-gates.json artifacts/verification-manifest.json > artifacts/release-evidence.sha256
      - name: Publish signed release-evidence attestation
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: artifacts/release-evidence.sha256
          predicate-type: https://github.com/saiaathishkarthik/picogent/attestation/release-evidence/v1
          predicate-path: artifacts/release-attestation-predicate.json
      - name: Verify release-gates attestation
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICATE_TYPE: https://github.com/saiaathishkarthik/picogent/attestation/release-evidence/v1
          SIGNER_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          gh attestation verify artifacts/release-gates.json \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$PREDICATE_TYPE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --format=json \
            > artifacts/release-gates-attestation.json
      - name: Verify verification-manifest attestation
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICATE_TYPE: https://github.com/saiaathishkarthik/picogent/attestation/release-evidence/v1
          SIGNER_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          gh attestation verify artifacts/verification-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$PREDICATE_TYPE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --format=json \
            > artifacts/verification-manifest-attestation.json
      - name: Upload verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: verification-manifest-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/verification-manifest.json
            artifacts/release-gates.json
          if-no-files-found: error
      - name: Upload release attestation evidence
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/release-attestation-predicate.json
            artifacts/release-evidence.sha256
            artifacts/release-gates-attestation.json
            artifacts/verification-manifest-attestation.json
          if-no-files-found: error
